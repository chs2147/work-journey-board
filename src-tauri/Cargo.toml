[package]
name = "work-journey-board"
version = "0.0.1"
description = "Work Journey Board — 주간 보드 기반 개인 업무 일지"
edition = "2021"

[lib]
name = "work_journey_board_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
# db_batch: 플러그인이 연 같은 연결 풀에서 sqlx 트랜잭션을 쓰기 위함(플러그인과 같은 sqlx 0.8)
sqlx = { version = "0.8", default-features = false, features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
