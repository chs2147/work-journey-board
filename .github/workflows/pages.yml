# 티저 사이트(site/)를 GitHub Pages로 배포 — 정적 파일, main 게시 전 검증판 표시 정리.
# site/ 가 바뀐 main 푸시 또는 수동 실행 때만. 앱 빌드·릴리스와 무관.
name: Deploy teaser site

on:
  push:
    branches: [main]
    paths: ["site/**", "scripts/site/prepare-release.mjs", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 만들기·배포를 두 작업으로 나눈다(GitHub 공식 예시 구조). 한 작업에서 올린 직후 바로 배포하면
  # 묶음 목록 반영이 늦을 때 "No artifacts named github-pages" 로 실패한다(2026-11-25 1.53.0 배포 때 2번 연속).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove Cabi.NET preview labels for main publication
        if: github.ref == 'refs/heads/main'
        run: node scripts/site/prepare-release.mjs
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
