# Work Journey Board 윈도우 설치 파일(NSIS, 현재 사용자 전용) 빌드.
# - 작업 브랜치(claude/**) 푸시: 빌드만 하고 Actions 산출물로 업로드(검증용)
# - main 푸시: 빌드 + 사전 릴리스 v<package.json 버전> 생성·갱신(태그는 워크플로가 생성)
# - 수동 실행: webview=offline 을 고르면 WebView2 오프라인 설치판(+약 130 MB)을 만든다(overview 13-4)
name: Build Windows installer

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "index.html"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:
    inputs:
      webview:
        description: "WebView2 설치 방식 (embed = 기본 설치판, offline = 오프라인 설치판)"
        type: choice
        options: [embed, offline]
        default: embed

permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}-${{ inputs.webview || 'embed' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      VARIANT: ${{ inputs.webview || 'embed' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Build NSIS installer
        shell: pwsh
        run: |
          if ($env:VARIANT -eq "offline") { npx tauri build --config src-tauri/tauri.offline.conf.json }
          else { npx tauri build }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Rust tests (backup file-name guard)
        run: cargo test --release --lib --manifest-path src-tauri/Cargo.toml

      - name: Collect installer
        id: collect
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $suffix = if ($env:VARIANT -eq "offline") { "_offline" } else { "" }
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $exe) { throw "NSIS 설치 파일을 찾지 못했습니다" }
          New-Item -ItemType Directory -Force out | Out-Null
          $name = "WorkJourneyBoard_${v}_setup${suffix}.exe"
          Copy-Item $exe.FullName "out/$name"
          $hash = (Get-FileHash "out/$name" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Out-File "out/SHA256SUMS${suffix}.txt" -Encoding ascii
          Get-Content "out/SHA256SUMS${suffix}.txt"
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: work-journey-board-windows-${{ env.VARIANT }}
          path: out/*
          retention-days: 14

      - name: Publish pre-release (main only)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.collect.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: "Work Journey Board v${{ steps.collect.outputs.version }}"
          prerelease: true
          overwrite_files: true
          body: |
            **Work Journey Board v${{ steps.collect.outputs.version }}** (개발 중 사전 릴리스)

            | 파일 | 용도 |
            |---|---|
            | `WorkJourneyBoard_${{ steps.collect.outputs.version }}_setup.exe` | 기본 설치 파일(현재 사용자 전용, WebView2 없으면 자동 설치) |
            | `…_setup_offline.exe` | (있을 때만) WebView2 오프라인 설치판 — 인터넷이 막힌 PC용 |
            | `SHA256SUMS*.txt` | 무결성 확인: `certutil -hashfile <파일> SHA256` |

            앱은 실행 중 인터넷으로 아무것도 보내지 않습니다.
          files: out/*
