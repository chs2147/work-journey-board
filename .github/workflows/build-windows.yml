# Work Journey Board 윈도우 설치 파일(NSIS, 현재 사용자 전용) 빌드.
# - 작업 브랜치(claude/**) 푸시: 빌드만 하고 Actions 산출물로 업로드(검증용)
# - main 푸시: 빌드 + 릴리스 v<package.json 버전> 생성·갱신(태그는 워크플로가 생성, 본문 = docs/release-notes/v<버전>.md)
#   · 0.x·-rc = 사전 릴리스, 기본판만
#   · 정식 판(1.0.0 이상, 꼬리표 없음) = 정식 릴리스(Latest), 기본판만(release-phase2-spec 4절)
# - 수동 실행: webview=offline 을 고르면 WebView2 오프라인 설치판(약 220 MB)을 만든다(overview 13-4).
#   main에서 실행하면 그 판 릴리스에 오프라인판을 더한다 — 오프라인판은 사용자가 요청할 때만(2026-11-01 사용자 지시)
name: Build Windows installer

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "src/**"
      # 브라우저 모드 전용(가짜 플랫폼·가상 샘플) — 실앱 동작과 무관하므로 이것만 바뀌면 설치 파일을 다시 만들지 않는다
      - "!src/platform/browser.ts"
      - "!src/platform/fakeFs.ts"
      - "!src/platform/sampleYear.ts"
      - "src-tauri/**"
      - "index.html"
      - "splash.html"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "docs/release-notes/**"
      - "scripts/release-notes.mjs"
      - "vite.config.ts"
      - "tsconfig.json"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:
    inputs:
      webview:
        description: "WebView2 설치 방식 (embed = 기본 설치판, offline = 오프라인 설치판)"
        type: choice
        options: [embed, offline]
        default: embed

permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}-${{ inputs.webview || 'push' }}
  cancel-in-progress: true

jobs:
  # 판 종류와 만들 설치판 목록을 정한다
  plan:
    runs-on: ubuntu-latest
    outputs:
      formal: ${{ steps.p.outputs.formal }}
      variants: ${{ steps.p.outputs.variants }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        shell: bash
        run: |
          formal=$(node scripts/release-notes.mjs formal)
          if [ -n "${{ inputs.webview }}" ]; then variants='["${{ inputs.webview }}"]'
          else variants='["embed"]'; fi
          echo "formal=$formal" >> "$GITHUB_OUTPUT"
          echo "variants=$variants" >> "$GITHUB_OUTPUT"
          echo "정식 판: $formal · 설치판: $variants"

  build:
    needs: plan
    runs-on: windows-latest
    strategy:
      fail-fast: true
      max-parallel: 1 # 같은 릴리스를 동시에 만들지 않게(기본판 → 오프라인판 순서)
      matrix:
        variant: ${{ fromJSON(needs.plan.outputs.variants) }}
    env:
      VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Build NSIS installer
        shell: pwsh
        run: |
          if ($env:VARIANT -eq "offline") { npx tauri build --config src-tauri/tauri.offline.conf.json }
          else { npx tauri build }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Rust tests (backup file-name guard)
        run: cargo test --release --lib --manifest-path src-tauri/Cargo.toml

      - name: Collect installer
        id: collect
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $suffix = if ($env:VARIANT -eq "offline") { "_offline" } else { "" }
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $exe) { throw "NSIS 설치 파일을 찾지 못했습니다" }
          New-Item -ItemType Directory -Force out | Out-Null
          $name = "WorkJourneyBoard_${v}_setup${suffix}.exe"
          Copy-Item $exe.FullName "out/$name"
          $hash = (Get-FileHash "out/$name" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Out-File "out/SHA256SUMS${suffix}.txt" -Encoding ascii
          Get-Content "out/SHA256SUMS${suffix}.txt"
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: work-journey-board-windows-${{ env.VARIANT }}
          path: out/*
          retention-days: 14

      # 릴리스 본문 = docs/release-notes/v<버전>.md + 설치 파일 표(improve-1027v3-spec 5절, 공통 규칙 3-6)
      - name: Compose release notes (main only)
        if: github.ref == 'refs/heads/main'
        run: node scripts/release-notes.mjs body ${{ steps.collect.outputs.version }} --out release-body.md

      # 정식 판이면 정식 릴리스(Latest), 아니면 사전 릴리스. 기본판·오프라인판이 같은 릴리스에 각자 파일을 올린다
      - name: Publish release (main only)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.collect.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: "Work Journey Board v${{ steps.collect.outputs.version }}"
          prerelease: ${{ needs.plan.outputs.formal != 'true' }}
          make_latest: ${{ needs.plan.outputs.formal == 'true' }}
          overwrite_files: true
          body_path: release-body.md
          files: out/*
