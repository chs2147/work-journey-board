# I-M0 회사 PC 설치 검증용 윈도우 설치 파일(NSIS, 현재 사용자 전용) 빌드.
# - main에 m0/ 변경이 들어오거나 수동 실행 시: Actions 산출물(artifact)로 업로드
# - 태그 m0-v* 푸시 시: 추가로 GitHub Release(사전 릴리스)에 설치 파일 첨부 → 회사 PC에서 바로 다운로드
name: M0 Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["m0/**", ".github/workflows/m0-windows-build.yml"]
    tags: ["m0-v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: m0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: m0/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "m0/src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Build NSIS installer
        run: npx tauri build

      - name: Collect installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $exe) { throw "NSIS 설치 파일을 찾지 못했습니다" }
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item $exe.FullName out/WJB-M0-Probe_setup.exe
          Compress-Archive -Path out/WJB-M0-Probe_setup.exe -DestinationPath out/WJB-M0-Probe_setup.zip
          $sums = Get-ChildItem out -File | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name }
          $sums | Out-File out/SHA256SUMS.txt -Encoding ascii
          Get-Content out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: wjb-m0-probe-windows
          path: m0/out/*
          retention-days: 30

      - name: Publish pre-release (tag only)
        if: startsWith(github.ref, 'refs/tags/m0-v')
        uses: softprops/action-gh-release@v2
        with:
          name: "M0 설치 검증 ${{ github.ref_name }}"
          prerelease: true
          body_path: m0/RELEASE_NOTES.md
          files: m0/out/*
