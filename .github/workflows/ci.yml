# 웹 앱 검사(리눅스): lint · 포맷 · 타입 · 단위 테스트 · E2E(브라우저 모드, Chromium + WebKit)
# + 맥 Rust 검사(macos-spec 4-1): 맥 분기 코드가 컴파일되고 cargo test를 통과하는지
name: CI

on:
  push:
    paths-ignore: ["docs/**", "**/*.md", "m0/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - name: Release notes for this version (improve-1027v3-spec 5절)
        run: node scripts/release-notes.mjs check
      - name: Quick guide check (features-1102-spec F6)
        run: node scripts/guide/guide.mjs check

      - name: Feature catalog and review workbook check
        run: node scripts/features/generate.mjs check

      - name: Install Playwright browsers (Chromium, WebKit)
        run: npx playwright install --with-deps chromium webkit
      - run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  # 맥 Rust 껍데기 검사(macos-spec 4-1) — #[cfg(target_os = "macos")] 코드·파일 가드·업데이트 교체 가드
  rust-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      # tauri 빌드 스크립트가 frontendDist(../dist)를 요구한다 — 검사에는 빈 폴더면 된다
      - run: mkdir -p dist && echo '<!doctype html>' > dist/index.html
      - run: cargo test --lib --manifest-path src-tauri/Cargo.toml

  # 주 전환 메모리 검사(optimize-1031-plan O1, 2026-11-01 사용자 확정: main만, 짧은 판)
  perf:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run perf:mem
        env:
          PERF_ROUNDS: "3"
          PERF_WEEKS: "20"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-report
          path: test-results/
          retention-days: 14
