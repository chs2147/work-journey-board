# 웹 앱 검사(리눅스): lint · 포맷 · 타입 · 단위 테스트 · E2E(브라우저 모드, Chromium + WebKit)
name: CI

on:
  push:
    paths-ignore: ["docs/**", "**/*.md", "m0/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - name: Release notes for this version (improve-1027v3-spec 5절)
        run: node scripts/release-notes.mjs check

      - name: Install Playwright browsers (Chromium, WebKit)
        run: npx playwright install --with-deps chromium webkit
      - run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
