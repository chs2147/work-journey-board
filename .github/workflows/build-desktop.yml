# Work Journey Board 데스크톱 설치 파일 빌드 — 하나의 원본, 두 플랫폼(macos-spec 4-1, 2026-11-02 사용자 승인)
# - 윈도우: NSIS 설치 파일(현재 사용자 전용) WorkJourneyBoard_<v>_setup.exe
# - 맥: 유니버설(인텔·애플 실리콘) DMG WorkJourneyBoard_<v>_mac.dmg — 애드혹 서명(D1 A안)
# - 작업 브랜치(claude/**, improve-v*, hotfix-*, 예전 작업 브랜치) 푸시: 두 빌드만 하고 Actions 산출물로 업로드(검증용)
#   · 2026-11-21 사용자 지시: v2-design·v2-g-stage는 빌드하지 않는다(기록 보존용) — 개선은 최신 main에서 새 브랜치(CLAUDE.md 6절)
#   · 정식판·DEV 운영 정책(docs/release-channel-spec.md, 2026-11-14 확정): main 밖 빌드는 모두 **DEV 검증판**
#     (`--features dev-channel` + `tauri.dev.conf.json` — 별도 앱 ID·설치·설정 폴더, 업데이트 꺼짐, 정식 일지 보호).
#     main 빌드만 정식판(지금과 같은 앱 ID·설정·일지)이며 릴리스도 main에서만 만든다
# - main 푸시: 두 빌드가 **모두 성공해야** 릴리스 v<package.json 버전>를 한 번에 만든다(D3 — 두 플랫폼 판 번호가 늘 같음)
#   · 0.x·-rc = 사전 릴리스, 정식 판(1.0.0 이상, 꼬리표 없음) = 정식 릴리스(Latest)(release-phase2-spec 4절)
#   · 릴리스 본문 = docs/release-notes/v<버전>.md + 설치 파일 표, SHA256SUMS.txt = 두 설치 파일을 합친 것
# - 수동 실행: webview=offline 을 고르면 윈도우 WebView2 오프라인 설치판(약 220 MB)만 만든다(overview 13-4, 맥은 해당 없음).
#   main에서 실행하면 그 판 릴리스에 오프라인판을 더한다 — 오프라인판은 사용자가 요청할 때만(2026-11-01 사용자 지시)
name: Build desktop installers

on:
  push:
    branches:
      [
        main,
        "claude/**",
        "design-renewal-v2",
        "universe-renewal-v2",
        "improve-v12",
        "improve-v13",
        "improve-v14",
        "improve-v16",
        "improve-v17",
        "improve-v18",
        "improve-v*",
        "hotfix-*",
        "cabinet-v2",
        "coaching-feature",
      ]
    paths:
      - "src/**"
      # 브라우저 모드 전용(가짜 플랫폼·가상 샘플) — 실앱 동작과 무관하므로 이것만 바뀌면 설치 파일을 다시 만들지 않는다
      - "!src/platform/browser.ts"
      - "!src/platform/fakeFs.ts"
      - "!src/platform/sampleYear.ts"
      - "src-tauri/**"
      - "index.html"
      - "splash.html"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "docs/release-notes/**"
      - "scripts/release-notes.mjs"
      - "vite.config.ts"
      - "tsconfig.json"
      - ".github/workflows/build-desktop.yml"
  workflow_dispatch:
    inputs:
      webview:
        description: "윈도우 WebView2 설치 방식 (embed = 기본 설치판 + 맥, offline = 윈도우 오프라인 설치판만)"
        type: choice
        options: [embed, offline]
        default: embed

permissions:
  contents: write

concurrency:
  group: build-desktop-${{ github.ref }}-${{ inputs.webview || 'push' }}
  cancel-in-progress: true

jobs:
  # 판 종류와 만들 설치판을 정한다
  plan:
    runs-on: ubuntu-latest
    outputs:
      formal: ${{ steps.p.outputs.formal }}
      variant: ${{ steps.p.outputs.variant }}
      mac: ${{ steps.p.outputs.mac }}
      version: ${{ steps.p.outputs.version }}
      channel: ${{ steps.p.outputs.channel }}
      label: ${{ steps.p.outputs.label }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        shell: bash
        run: |
          formal=$(node scripts/release-notes.mjs formal)
          variant="${{ inputs.webview }}"; [ -z "$variant" ] && variant=embed
          mac=true; [ "$variant" = "offline" ] && mac=false
          version=$(node -p "require('./package.json').version")
          # 판 꼬리표(package.json releaseLabel — 1.50.0 = Open Beta). 판 번호·설치 파일 이름에는 넣지 않는다(예전 판 새 판 확인 호환)
          label=$(node scripts/release-notes.mjs label)
          # 정식판 = main 빌드만. 그 밖(작업 브랜치·RC)은 DEV 검증판(docs/release-channel-spec.md 2절)
          channel=dev; [ "${{ github.ref }}" = "refs/heads/main" ] && channel=official
          {
            echo "formal=$formal"; echo "variant=$variant"; echo "mac=$mac"; echo "version=$version"; echo "channel=$channel"; echo "label=$label"
          } >> "$GITHUB_OUTPUT"
          echo "판 $version ${label} · 정식 판: $formal · 윈도우 설치판: $variant · 맥: $mac · 채널: $channel"

  windows:
    needs: plan
    runs-on: windows-latest
    env:
      VARIANT: ${{ needs.plan.outputs.variant }}
      CHANNEL: ${{ needs.plan.outputs.channel }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Build NSIS installer
        shell: pwsh
        run: |
          $a = @()
          if ($env:VARIANT -eq "offline") { $a += @("--config", "src-tauri/tauri.offline.conf.json") }
          if ($env:CHANNEL -eq "dev") { $a += @("--config", "src-tauri/tauri.dev.conf.json", "--features", "dev-channel") }
          npx tauri build @a
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Rust tests (file guards · update · cabinet · DEV guard)
        run: |
          cargo test --release --lib --manifest-path src-tauri/Cargo.toml
          cargo test --release --lib --manifest-path src-tauri/Cargo.toml --features dev-channel

      - name: Collect installer
        shell: pwsh
        run: |
          $v = "${{ needs.plan.outputs.version }}"
          $suffix = if ($env:VARIANT -eq "offline") { "_offline" } else { "" }
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $exe) { throw "NSIS 설치 파일을 찾지 못했습니다" }
          $isDev = $exe.Name -like "Work Journey Board DEV*"
          if (($env:CHANNEL -eq "dev") -ne $isDev) { throw "채널($env:CHANNEL)과 설치 파일 이름이 맞지 않습니다: $($exe.Name)" }
          $prefix = if ($env:CHANNEL -eq "dev") { "WorkJourneyBoardDEV" } else { "WorkJourneyBoard" }
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item $exe.FullName "out/${prefix}_${v}_setup${suffix}.exe"
          Get-ChildItem out

      - uses: actions/upload-artifact@v4
        with:
          name: work-journey-board-windows-${{ env.VARIANT }}${{ env.CHANNEL == 'dev' && '-DEV' || '' }}
          path: out/*
          retention-days: 14

  macos:
    needs: plan
    if: needs.plan.outputs.mac == 'true'
    runs-on: macos-latest
    env:
      CHANNEL: ${{ needs.plan.outputs.channel }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      # DMG 창 배경·아이콘 위치는 Finder 스크립트로 꾸민다. CI=true면 Tauri가 이 단계를 건너뛰므로 먼저 CI=false로 해 보고,
      # Finder 스크립트가 러너에서 실패하면 꾸밈 없이 다시 묶는다(설치 파일 자체는 같다)
      - name: Build universal DMG
        shell: bash
        run: |
          args="--target universal-apple-darwin"
          [ "$CHANNEL" = "dev" ] && args="$args --config src-tauri/tauri.dev.conf.json --features dev-channel"
          if ! CI=false npx tauri build $args; then
            echo "::warning::DMG 꾸미기(Finder 스크립트)에 실패해 꾸밈 없이 다시 묶습니다"
            CI=true npx tauri build $args
          fi

      - name: Rust tests (file guards · update · cabinet · DEV guard — macOS)
        run: |
          cargo test --release --lib --manifest-path src-tauri/Cargo.toml
          cargo test --release --lib --manifest-path src-tauri/Cargo.toml --features dev-channel

      - name: Collect DMG
        shell: bash
        run: |
          v="${{ needs.plan.outputs.version }}"
          dmg=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          test -n "$dmg" || { echo "DMG를 찾지 못했습니다"; exit 1; }
          prefix=WorkJourneyBoard; [ "$CHANNEL" = "dev" ] && prefix=WorkJourneyBoardDEV
          mkdir -p out && cp "$dmg" "out/${prefix}_${v}_mac.dmg"
          hdiutil verify "out/${prefix}_${v}_mac.dmg"
          ls -l out

      # 배포되는 DMG 안의 앱을 검사한다(Tauri는 DMG를 만든 뒤 bundle/macos의 .app을 남기지 않는다)
      - name: Check app in DMG (universal · version · signature · Applications link)
        shell: bash
        run: |
          v="${{ needs.plan.outputs.version }}"
          prefix=WorkJourneyBoard; [ "$CHANNEL" = "dev" ] && prefix=WorkJourneyBoardDEV
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "out/${prefix}_${v}_mac.dmg"
          trap 'hdiutil detach -force "$mnt"' EXIT
          ls -la "$mnt"
          test -L "$mnt/Applications"
          app=$(find "$mnt" -maxdepth 1 -name "*.app" | head -1)
          test -n "$app" || { echo "DMG 안에 앱이 없습니다"; exit 1; }
          for b in "$app"/Contents/MacOS/*; do echo "$b: $(lipo -archs "$b")"; lipo -archs "$b" | grep -q "x86_64 arm64\|arm64 x86_64"; done
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$v"
          /usr/libexec/PlistBuddy -c "Print :CFBundleDevelopmentRegion" "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "$app/Contents/Info.plist"
          # 채널과 앱 ID가 맞는지(DEV는 정식판과 다른 앱으로 설치·실행)
          id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")
          if [ "$CHANNEL" = "dev" ]; then test "$id" = "com.chs2147.workjourneyboard.dev"; else test "$id" = "com.chs2147.workjourneyboard"; fi
          codesign --verify --deep --strict "$app" && codesign -dv "$app" 2>&1 | grep -E "Signature|Identifier"

      - uses: actions/upload-artifact@v4
        with:
          name: work-journey-board-macos${{ env.CHANNEL == 'dev' && '-DEV' || '' }}
          path: out/*
          retention-days: 14

  # main만: 두 플랫폼이 모두 성공해야 릴리스(오프라인판 수동 실행은 맥 없이 윈도우만)
  release:
    needs: [plan, windows, macos]
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      needs.windows.result == 'success' &&
      (needs.macos.result == 'success' || (needs.macos.result == 'skipped' && needs.plan.outputs.mac == 'false'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dl
          pattern: work-journey-board-*
          merge-multiple: true

      - name: Collect review Feature List workbook
        shell: bash
        env:
          APP_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          mkdir -p out
          feature_workbook="docs/features/exports/work-journey-board/Work-Journey-Board-Feature-List-v${APP_VERSION}.xlsx"
          cp "$feature_workbook" out/

      # SHA256SUMS.txt = 기본 설치 파일들(윈도우 exe + 맥 dmg), SHA256SUMS_offline.txt = 오프라인판
      - name: Checksums
        shell: bash
        run: |
          mkdir -p out && cp dl/* out/ && cd out
          ls *_offline.exe >/dev/null 2>&1 && sha256sum *_offline.exe > SHA256SUMS_offline.txt
          base=$(ls *.exe *.dmg 2>/dev/null | grep -v _offline || true)
          [ -n "$base" ] && sha256sum $base > SHA256SUMS.txt
          sha256sum *Feature-List*.xlsx > SHA256SUMS_features.txt
          cat SHA256SUMS*.txt; ls -l

      # 릴리스 본문 = docs/release-notes/v<버전>.md + 설치 파일 표(improve-1027v3-spec 5절, 공통 규칙 3-6)
      - name: Compose release notes
        run: node scripts/release-notes.mjs body ${{ needs.plan.outputs.version }} --out release-body.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.plan.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: "Work Journey Board v${{ needs.plan.outputs.version }}${{ needs.plan.outputs.label != '' && format(' {0}', needs.plan.outputs.label) || '' }}"
          prerelease: ${{ needs.plan.outputs.formal != 'true' }}
          make_latest: ${{ needs.plan.outputs.formal == 'true' }}
          overwrite_files: true
          body_path: release-body.md
          files: out/*
