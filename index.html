<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Work Journey Board</title>
    <link rel="icon" href="data:," />
    <!--
      시작 스플래시(docs/splash-spec.md, 시안 B). JS 번들 전에 그려야 하므로 HTML·CSS만 쓴다(인라인 script·style 속성 금지 — CSP).
      색은 tokens.css·palette.ts, 문구는 strings.ts·week.ts와 같은 값이어야 한다 — tests/unit/splash.test.ts가 대조한다.
    -->
    <style>
      #splash {
        --sp-page: #faf9f5;
        --sp-card: #ffffff;
        --sp-line: #d3d1c7;
        --sp-text-1: #2c2c2a;
        --sp-text-2: #5f5e5a;
        --sp-text-3: #8a8983;
        --sp-today: #d85a30;
        --sp-c1: #2a78d6;
        --sp-c2: #eb6834;
        --sp-c3: #1baf7a;
        --sp-c4: #eda100;
        --sp-c5: #e87ba4;
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        background: var(--sp-page);
        color: var(--sp-text-1);
        font-family: "Malgun Gothic", "맑은 고딕", "Segoe UI", system-ui, sans-serif;
        transition: opacity 160ms ease-out;
      }
      @media (prefers-color-scheme: dark) {
        #splash {
          --sp-page: #1a1a19;
          --sp-card: #232322;
          --sp-line: #3d3d3a;
          --sp-text-1: #f0efec;
          --sp-text-2: #c3c2b7;
          --sp-text-3: #8f8e86;
          --sp-today: #ef7a4d;
          --sp-c1: #3987e5;
          --sp-c2: #d95926;
          --sp-c3: #199e70;
          --sp-c4: #c98500;
          --sp-c5: #d55181;
        }
      }
      #splash.leaving {
        opacity: 0;
      }
      .splash-sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
      }
      .splash-body {
        display: grid;
        justify-items: center;
        gap: 30px;
      }
      .splash-week {
        display: grid;
        grid-template-columns: repeat(5, 118px);
        gap: 16px;
      }
      .splash-day {
        display: grid;
        justify-items: center;
        gap: 8px;
        font-size: 13px;
        color: var(--sp-text-3);
      }
      .splash-day.today {
        color: var(--sp-today);
        font-weight: 700;
      }
      .splash-card {
        box-sizing: border-box;
        width: 100%;
        height: 150px;
        padding: 18px 14px;
        display: grid;
        align-content: start;
        gap: 16px;
        background: var(--sp-card);
        border: 1px solid var(--sp-line);
        border-radius: 10px;
        transition:
          border-color 200ms,
          box-shadow 200ms;
      }
      .splash-day.today .splash-card {
        border-color: var(--sp-today);
        box-shadow: 0 0 0 1px var(--sp-today);
      }
      .splash-card i {
        display: flex;
        align-items: center;
        gap: 9px;
        transform-origin: left center;
        animation: splash-draw 160ms ease-out both;
        animation-delay: calc(var(--i) * 40ms);
      }
      .splash-card i::before {
        content: "";
        flex: none;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--c);
      }
      .splash-card i::after {
        content: "";
        width: var(--w);
        height: 7px;
        border-radius: 4px;
        background: var(--sp-line);
      }
      /* 줄별 순서·길이·색 — 인라인 style 속성은 쓰지 않는다(Tauri가 <style>에 nonce를 넣으면 'unsafe-inline'이 무시돼 막힘) */
      .splash-card .l0 {
        --i: 0;
        --w: 78%;
        --c: var(--sp-c1);
      }
      .splash-card .l1 {
        --i: 1;
        --w: 60%;
        --c: var(--sp-c2);
      }
      .splash-card .l2 {
        --i: 2;
        --w: 70%;
        --c: var(--sp-c2);
      }
      .splash-card .l3 {
        --i: 3;
        --w: 88%;
        --c: var(--sp-c3);
      }
      .splash-card .l4 {
        --i: 4;
        --w: 50%;
        --c: var(--sp-c4);
      }
      .splash-card .l5 {
        --i: 5;
        --w: 84%;
        --c: var(--sp-c3);
      }
      .splash-card .l6 {
        --i: 6;
        --w: 56%;
        --c: var(--sp-c4);
      }
      .splash-card .l7 {
        --i: 7;
        --w: 64%;
        --c: var(--sp-c4);
      }
      .splash-card .l8 {
        --i: 8;
        --w: 80%;
        --c: var(--sp-c5);
      }
      .splash-card .l9 {
        --i: 9;
        --w: 44%;
        --c: var(--sp-c1);
      }
      .splash-card .l10 {
        --i: 10;
        --w: 74%;
        --c: var(--sp-c5);
      }
      .splash-card .l11 {
        --i: 11;
        --w: 58%;
        --c: var(--sp-c1);
      }
      @keyframes splash-draw {
        from {
          opacity: 0;
          transform: scaleX(0.2);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .splash-titles {
        display: grid;
        justify-items: center;
        gap: 6px;
      }
      .splash-name {
        margin: 0;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .splash-tag {
        margin: 0;
        font-size: 15px;
        color: var(--sp-text-2);
      }
      .splash-msg {
        position: absolute;
        left: 50%;
        bottom: 64px;
        margin: 0;
        transform: translateX(-50%);
        font-size: 13px;
        color: var(--sp-text-2);
        white-space: nowrap;
        opacity: 0;
        transition: opacity 200ms;
      }
      .splash-msg.on {
        opacity: 1;
      }
      .splash-ver {
        position: absolute;
        right: 28px;
        bottom: 22px;
        margin: 0;
        font-size: 12px;
        color: var(--sp-text-3);
      }
      @media (prefers-reduced-motion: reduce) {
        #splash,
        #splash * {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="splash" role="status">
      <span class="splash-sr">불러오는 중…</span>
      <div class="splash-body" aria-hidden="true">
        <div class="splash-week">
          <div class="splash-day">
            <span>월</span>
            <div class="splash-card">
              <i class="l0"></i>
              <i class="l1"></i>
            </div>
          </div>
          <div class="splash-day">
            <span>화</span>
            <div class="splash-card">
              <i class="l2"></i>
              <i class="l3"></i>
              <i class="l4"></i>
            </div>
          </div>
          <div class="splash-day">
            <span>수</span>
            <div class="splash-card">
              <i class="l5"></i>
              <i class="l6"></i>
            </div>
          </div>
          <div class="splash-day">
            <span>목</span>
            <div class="splash-card">
              <i class="l7"></i>
              <i class="l8"></i>
              <i class="l9"></i>
            </div>
          </div>
          <div class="splash-day">
            <span>금</span>
            <div class="splash-card">
              <i class="l10"></i>
              <i class="l11"></i>
            </div>
          </div>
        </div>
        <div class="splash-titles">
          <p class="splash-name">Work Journey Board</p>
          <p class="splash-tag">오늘 한 일을, 한 줄씩</p>
        </div>
      </div>
      <p class="splash-msg" id="splash-msg"></p>
      <p class="splash-ver" aria-hidden="true">v%APP_VERSION%</p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
