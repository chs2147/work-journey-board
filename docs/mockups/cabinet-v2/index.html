<script>
const icon=(n)=>`<svg class="ico" aria-hidden="true"><use href="#i-${n}"></use></svg>`;
const ib=(n,title,action='info')=>`<button class="iconbtn" title="${title}" aria-label="${title}" data-action="${action}">${icon(n)}</button>`;
const btn=(n,label,action='info',primary=false)=>`<button data-action="${action}" class="${primary?'primary':''}">${icon(n)}${label}</button>`;
const scenes={hub:{label:'01 업무 허브',title:'Cabi.NET — 서비스 개편',options:[['A · 업무 허브형','익숙한 업무 목록을 유지하고, 자료·노트·보드를 한곳에서 엽니다.','기존 목록과 가장 가까운 구성입니다. 미리보기는 필요할 때만 여세요.'],['B · 자료 갤러리형','노트와 폴더·링크를 카드로 훑어보는 시각 중심의 허브입니다.','자료를 이미지로 찾기 편한 대신 같은 면적에 표시되는 항목이 줄어듭니다.'],['C · 노트 중심형','업무별 노트를 중심에 놓고 자료함은 별도 탭으로 구분합니다.','노트 작성 빈도가 높은 업무에 적합합니다. 자료함 탭도 눌러 비교하세요.']]},note:{label:'02 노트 편집기',title:'개편 방향과 결정 사항 — 서비스 개편 · Cabi.NET',options:[['A · 문서 집중형','별도 창에서 한 페이지에 집중합니다. 목차는 접을 수 있습니다.','주간 화면을 열어 둔 채 이 노트를 편집합니다. 한 업무에 여러 노트를 만들 수 있습니다.'],['B · 노트 탐색형','같은 업무의 다른 노트를 곁에 두고 빠르게 전환합니다.','노트가 많은 업무에 편리합니다. 왼쪽 목록이 본문 폭을 사용합니다.'],['C · 편집·미리보기형','블록 편집과 내보내기 결과를 나란히 확인합니다.','본문은 블록 편집입니다. 원시 Markdown 소스를 입력하는 방식이 아닙니다.']]},board:{label:'03 업무 메모보드',title:'서비스 개편 — 업무 보드 · Cabi.NET',options:[['A · 캔버스 집중형','접이식 자료함과 넓은 캔버스. 익숙한 주간 메모 조작을 그대로 사용합니다.','자료함을 열어 항목을 캔버스에 끌어 놓아 보세요. 실제 앱 구현이 아닌 화면 데모입니다.'],['B · 자료 선반형','아래쪽 자료 선반에서 필요한 항목을 끌어올립니다.','좌우 폭을 넓게 쓸 수 있지만 캔버스의 높이는 줄어듭니다.'],['C · 업무 스튜디오형','자료함·캔버스·누적 주간 메모를 동시에 살펴봅니다.','한 업무에 자료가 많을 때 유리합니다. 패널은 실제 구현 시 접기·폭 조절을 지원합니다.']]},weekly:{label:'04 주간 메모 연동',title:'서비스 개편 — 주간 메모 모아보기 · Cabi.NET',options:[['A · 오른쪽 모아보기','업무와 연결된 여러 주차의 메모를 보면서 보드에 연결합니다.','기본 동작은 원본 연결입니다. 사본 만들기와 구분해 검토해 주세요.'],['B · 넓은 선택 화면','여러 메모를 넓은 화면에서 비교하고 일괄 선택합니다.','많은 메모를 모으기 편합니다. 선택하는 동안 보드는 가려집니다.'],['C · 업무별 기록 브라우저','주차별 흐름을 따라 메모를 찾고 보드로 보냅니다.','전체 기간이 기본이며 날짜별 업무항목과 연결된 메모만 자동 조회됩니다.']]},drag:{label:'05 창 간 복제',title:'창 간 드래그 — 주간 메모 ↔ 업무 보드',options:[['A · 위치 직접 드롭','원하는 위치에 선택 묶음을 그대로 복제합니다. 원본은 유지됩니다.','왼쪽 메모를 오른쪽 판으로 끌어 보세요. 시각 검토용이며 네이티브 창 간 동작 검증은 별도로 합니다.'],['B · 화면 가장자리 받기','목적 창 상단에 받을 영역을 명확히 표시합니다.','복제할 창을 알아보기 쉽습니다. 놓은 다음 배치를 정하는 단계가 생깁니다.'],['C · 복제 내용 확인형','복제될 객체·관계·출처를 한 번 확인한 후 확정합니다.','큰 묶음을 안전하게 확인하는 데 적합하지만 반복 복제 시 클릭이 늘어납니다.']]}};
const state={scene:'hub',variant:0,hubView:'list',hubType:'all',hubTab:'notes',preview:false,library:false,toc:true,filter:'all',selected:new Set([0,1]),copied:false,reverse:false};
const resources=[{kind:'note',title:'개편 방향과 결정 사항',sub:'목표 · 주요 결정 · 다음 단계',date:'오늘 14:32',name:'노트'},{kind:'note',title:'사용자 인터뷰 정리',sub:'고객 피드백과 개선 아이디어',date:'어제 17:08',name:'노트'},{kind:'folder',title:'서비스 개편 자료',sub:'D:\\Projects\\서비스 개편',date:'11월 03일',name:'폴더'},{kind:'link',title:'서비스 가이드라인',sub:'https://example.com/design-guide',date:'11월 02일',name:'링크'},{kind:'note',title:'회의 기록 · 11월 1주',sub:'논의 내용과 후속 확인 항목',date:'11월 02일',name:'노트'},{kind:'folder',title:'사용자 리서치',sub:'D:\\Research\\2026',date:'10월 28일',name:'폴더'}];
const memos=[['11월 1주 · 11.02–11.08','메인 화면 개선 아이디어','사용자 동선을 줄이고 핵심 행동을 전면에 배치','연결 업무항목 2개'],['10월 5주 · 10.26–11.01','인터뷰에서 발견한 것','자료가 흩어져 맥락을 찾기 어렵다는 피드백','연결 업무항목 1개'],['10월 4주 · 10.19–10.25','초기 구성 스케치','노트와 참고 자료를 업무 단위로 모으기','연결 업무항목 3개'],['10월 3주 · 10.12–10.18','검토할 자료 목록','진행 과정을 한눈에 볼 수 있으면 좋겠음','이미 연결됨']];
function sidebar(){return `<aside class="sidebar"><div class="brand"><div class="mark">C.</div>Cabi.NET</div><button class="siderow" data-action="info">${icon('grid')}전체 자료<span>28</span></button><div class="sideheading">진행 중인 업무</div>${[['서비스 개편','#9b8054','12'],['브랜드 운영','#648f86','8'],['제품 리서치','#829b67','6'],['개인 공부','#8787a7','2']].map(([n,c,count],i)=>`<button class="siderow ${i===0?'sel':''}" data-action="${i===0?'current':'sample'}"><i class="square" style="background:${c}"></i>${n}<span>${count}</span></button>`).join('')}<div class="sideheading">보관함</div><button class="siderow" data-action="info">${icon('clock')}종료된 업무<span>4</span></button><button class="siderow" data-action="info">${icon('folder')}연결 없는 자료<span>2</span></button><div style="margin:70px 12px 0;font-size:10px;color:#939587;line-height:1.8">회사 워크스페이스<br>날짜에 관계없이 업무별로 보관</div></aside>`;}
function search(placeholder='이 업무에서 검색',id=''){return `<label class="search">${icon('search')}<input ${id?`id="${id}"`:''} aria-label="${placeholder}" placeholder="${placeholder}"></label>`;}
function row(r){return `<div class="trow" data-resource="${r.title}"><button class="rowtitle listbutton" data-action="${r.kind==='note'?'open-note':'preview'}"><span class="fileicon ${r.kind==='note'?'note':''}">${icon(r.kind)}</span><span><strong>${r.title}</strong><small>${r.sub}</small></span></button><span class="muted">${r.name}</span><span class="linkcol"><span class="tag">서비스 개편</span></span><span class="datecol muted">${r.date}</span>${ib('more','항목 메뉴')}</div>`;}
function card(r){return `<article class="resourcecard" data-resource="${r.title}" tabindex="0" data-action="${r.kind==='note'?'open-note':'preview'}"><span class="fileicon ${r.kind==='note'?'note':''}">${icon(r.kind)}</span><span class="tag">${r.name}</span><h3>${r.title}</h3><p>${r.sub}</p><small class="muted">${r.date} 수정</small></article>`;}
function hub(){const v=state.variant;let view=state.hubView;let rs=resources.filter(r=>state.hubType==='all'||r.kind===state.hubType);if(v===2)rs=rs.filter(r=>state.hubTab==='notes'?r.kind==='note':r.kind!=='note');return `${sidebar()}<div class="content"><div class="contenthead"><div class="headrow"><div><div class="eyebrow">TASK LIBRARY</div><h2>서비스 개편</h2><span class="small muted">자료 9개 · 노트 3개 · 업무 보드 1개</span></div><div class="actions">${btn('note','새 노트','open-note',true)}${btn('board','업무 보드 열기','open-board')}${ib('plus','폴더·링크 등록','register')}</div></div></div><div class="summarybar">${icon('board')}<span>업무의 자료와 생각을 자유롭게 연결하세요.</span><span class="tag green">보드 1개</span><button class="openboard" data-action="open-board">${icon('arrow')}별도 창에서 열기</button></div><div class="filters"><div class="seg">${v===2?`<button class="${state.hubTab==='notes'?'active':''}" data-tab="notes">${icon('note')}노트</button><button class="${state.hubTab==='resources'?'active':''}" data-tab="resources">${icon('folder')}자료함</button>`:[['all','전체'],['note','노트'],['folder','폴더'],['link','링크']].map(([k,n])=>`<button data-filter="${k}" class="${state.hubType===k?'active':''}">${n}</button>`).join('')}</div><div class="actions">${search('자료 제목 검색','hubSearch')}<div class="seg">${[['list','list','목록 보기'],['cards','grid','카드 보기'],['board','board','보드 미리보기']].map(([k,i,t])=>`<button class="iconbtn ${view===k?'active':''}" data-view="${k}" title="${t}" aria-label="${t}">${icon(i)}</button>`).join('')}</div>${ib('panel','미리보기 패널','preview')}</div></div><div style="display:flex;flex:1;min-height:0"><div class="content">${view==='board'?`<div class="canvas hubboard">${boardObjects(true)}<div class="boardlegend">보드 미리보기 · 편집은 별도 창에서</div></div>`:view==='cards'?`<div class="cards">${rs.map(card).join('')}</div>`:`<div class="table"><div class="trow th"><span>제목</span><span>종류</span><span class="linkcol">업무</span><span class="datecol">수정</span><span></span></div>${rs.map(row).join('')}<div class="noresults is-hidden">검색 결과가 없습니다.</div></div>`}<div class="footline"><span>업무 단위 보관 · 현재 주차와 무관</span><span>${rs.length}개 표시</span></div></div>${state.preview?`<aside class="preview"><div class="headrow"><span class="eyebrow">PREVIEW</span>${ib('x','미리보기 닫기','preview')}</div><h3>개편 방향과<br>결정 사항</h3><span class="tag green">노트</span><p>하나의 업무 아래에 자료와 생각을 모으고, 기록이 일정에 묶이지 않도록 합니다.</p><div class="docline"></div><p>소속 업무 · 서비스 개편<br>오늘 14:32 수정</p>${btn('arrow','노트 열기','open-note')}</aside>`:''}</div></div>`;}
function noteBody(){return `<div class="docmeta"><span>서비스 개편</span><span>오늘 14:32 수정</span></div><h1>개편 방향과 결정 사항</h1><p>자료가 모이는 곳에서 생각도 이어질 수 있도록.<br>업무의 배경부터 결정까지, 일정과 관계없이 기록합니다.</p><div class="callout">업무를 중심으로 노트와 자료를 모으고,<br>필요한 순간 자유로운 보드 위에서 연결합니다.</div><h2>01. 이번 개편의 목표</h2><ul><li>여러 주차에 흩어진 메모를 업무 맥락에서 이어 보기</li><li>참고 자료와 결정 사항을 한곳에 보관하기</li></ul><h2>02. 합의된 방향</h2><label class="checkrow"><input type="checkbox" checked>업무 하나에 여러 노트, 보드는 하나</label><label class="checkrow"><input type="checkbox" checked>주간 메모와 업무 보드 간 객체 복제 지원</label><label class="checkrow"><input type="checkbox">자료 구조와 내보내기 결과 확인</label><div class="docline"></div><p>참고 문서: <a href="#" data-action="link-info">서비스 가이드라인 ↗</a></p><div class="blockhint"><span>⋮⋮</span>${icon('plus')}내용을 입력하거나 / 로 블록 추가</div>`;}
function note(){return `<div class="content"><div class="notebar"><div class="breadcrumbs"><span>Cabi.NET</span><span>/</span><span class="square"></span><span>서비스 개편</span><span>/</span><span>노트</span></div><div class="actions"><span class="saved"><i></i>저장됨</span>${btn('upload','가져오기','import')}${btn('download','내보내기','export')}${ib('panel','목차 열기/닫기','toc')}${ib('more','노트 메뉴')}</div></div><div class="editorwrap">${state.variant===1?`<aside class="docside"><div class="sideheading">서비스 개편 · 노트</div>${btn('plus','새 노트','new-note')}<div class="notelist">${resources.filter(r=>r.kind==='note').map((r,i)=>`<button class="noteitem ${i===0?'sel':''}" data-action="${i===0?'current':'sample'}"><strong>${r.title}</strong><span>${r.date}</span></button>`).join('')}</div></aside>`:''}<article class="document"><div class="docpage">${noteBody()}</div></article>${state.variant===2?`<aside class="splitpreview"><div class="eyebrow" style="margin-bottom:15px">PDF PREVIEW · A4</div><div class="paper"><span style="font-size:9px;color:#819071">Cabi.NET / 서비스 개편</span><h2>개편 방향과 결정 사항</h2><p>자료가 모이는 곳에서 생각도 이어질 수 있도록.<br>업무의 배경부터 결정까지 기록합니다.</p><hr style="border:0;border-top:1px solid #ccd3c1;margin:25px 0"><h3>01. 이번 개편의 목표</h3><p>• 여러 주차의 메모를 업무 맥락에서 이어 보기<br>• 참고 자료와 결정 사항을 한곳에 보관하기</p><h3>02. 합의된 방향</h3><p>☑ 업무 하나에 여러 노트, 보드는 하나<br>☑ 주간 메모와 업무 보드 간 객체 복제</p></div><p class="small muted">내보내기 모양을 확인하는 예시입니다.</p></aside>`:state.toc?`<aside class="toc"><h4>이 페이지</h4><p style="color:#4e6e54">이번 개편의 목표</p><p>합의된 방향</p><div class="docline"></div><p style="font-size:11px;line-height:1.8">문단 · 제목 · 목록<br>체크 · 코드 · 표 · 이미지</p></aside>`:''}</div><div class="footline"><span>독립된 노트 창 · 주간 화면을 함께 사용할 수 있습니다.</span><span>자동 저장</span></div></div>`;}
function library(bottom=false){return `<${bottom?'div':'aside'} class="${bottom?'bottomshelf':'shelf'}">${bottom?'<span class="eyebrow">자료 선반</span>':`<div class="headrow"><h3>업무 자료함</h3>${ib('x','자료함 닫기','library')}</div><p>자료를 보드로 끌어오면<br>원본 연결 카드가 만들어집니다.</p>`}${resources.slice(0,4).map((r,i)=>`<div class="libraryitem" draggable="true" data-drag="resource:${i}" tabindex="0">${icon(r.kind)}${r.title}</div>`).join('')}</${bottom?'div':'aside'}>`;}
function boardObjects(compact=false){return `<svg class="connections" viewBox="0 0 900 510" preserveAspectRatio="none"><path d="M300 200H420V138H492"/><path d="M295 235H370V358H475"/></svg><article class="box yellow ${compact?'':'selected'}" style="left:12%;top:${compact?'26':'100'}px;width:230px" draggable="true" data-drag="board:idea"><small>자유 메모</small><h3>업무의 맥락을 모으는 곳</h3><p>일정마다 쌓인 기록과 자료를<br>이 업무의 보드에서 이어 보기</p><p style="margin-top:13px;font-size:10px;color:#9b957c">텍스트 · 이미지 · 링크 · 관계선</p></article><article class="box ref" style="left:56%;top:${compact?'25':'70'}px"><div class="boxtag">${icon('note')}노트 원본 연결</div><h3>개편 방향과 결정 사항</h3><p>목표와 합의된 방향 정리</p><small style="margin-top:13px">더블클릭 → 노트 창 열기 ↗</small></article><article class="box ref" style="left:54%;top:${compact?'192':'295'}px"><div class="boxtag">${icon('folder')}등록 자료</div><h3>서비스 개편 자료</h3><p>폴더 · 원본 파일은 그대로</p><small style="margin-top:13px">D:\\Projects\\서비스 개편</small></article>${compact?'':`<article class="box blue" style="left:13%;top:333px;width:220px"><small>출처 · 10월 5주 / 독립 사본</small><h3>인터뷰에서 발견한 것</h3><p>자료가 흩어져 있어 맥락을<br>찾기 어렵다는 피드백</p></article>`}`;}
function boardToolbar(){return `<div class="boardtools">${ib('cursor','선택 도구')}${ib('plus','메모 추가')}${ib('image','이미지 추가')}${ib('link','관계선 연결')}</div><div class="zoom"><button data-action="zoom-out" aria-label="축소">−</button><span id="zoomValue">100%</span><button data-action="zoom-in" aria-label="확대">＋</button></div>`;}
function weekCard(m,i){return `<article class="weekcard ${state.selected.has(i)?'checked':''}" data-week="${i}"><header><span>${m[0]}</span><input type="checkbox" aria-label="${m[1]} 선택" ${state.selected.has(i)?'checked':''}></header><h4>${m[1]}</h4><p>${m[2]}</p><p style="margin-top:11px;font-size:10px">${m[3]}</p></article>`;}
function weeklyPanel(modal=false){return `<div class="${modal?'floatingmodal':'weeklypanel'}"><div class="panelhead"><div class="headrow"><h3 style="font-size:14px;font-weight:550;margin:0 0 8px">주간 메모 모아보기</h3>${ib('x','주간 메모 닫기','close-weekly')}</div><p>서비스 개편에 연결된 메모 · 전체 기간<br>같은 메모는 한 번만 표시합니다.</p>${search('메모 내용 검색','weekSearch')}</div><div class="weeklylist">${memos.map(weekCard).join('')}</div><div class="panelfoot"><select id="linkMode" aria-label="추가 방식"><option value="ref">원본 연결 · 최신 내용 보기</option><option value="copy">사본 만들기 · 독립 편집</option></select><button class="primary" data-action="add-weekly">${icon('link')}<span id="selectedCount">${state.selected.size}개</span> 보드에 추가</button></div></div>`;}
function board(){const v=state.variant;let lib=v===2||state.library;return `<div class="content"><div class="boardbar"><div><span class="eyebrow">Cabi.NET / TASK BOARD</span><h2><span class="square" style="margin-right:8px"></span>서비스 개편</h2></div><div class="actions"><span class="saved"><i></i>저장됨</span>${btn('folder','자료함','library')}${btn('clock','주간 메모','open-weekly')}${ib('more','보드 메뉴')}</div></div><div class="boardbody">${lib&&v!==1?library():''}<div class="canvas" data-drop="task">${boardToolbar()}${boardObjects()}<div class="boardlegend">업무당 하나의 보드 · 일정과 무관하게 보관</div></div>${v===2?weeklyPanel():''}</div>${v===1?library(true):''}</div>`;}
function weekly(){if(state.variant===2)return `<div class="content"><div class="boardbar"><div><div class="eyebrow">Cabi.NET / COLLECT</div><h2>서비스 개편 · 주간 메모 모아보기</h2></div>${btn('board','업무 보드 열기','open-board')}</div><div class="timelinebrowser"><aside class="weekrail"><span class="small muted">2026년</span><strong>11월</strong><p class="sel">1주</p><strong>10월</strong><p>5주</p><p>4주</p><p>3주</p><p>전체 기간</p></aside><div class="browsermain"><div class="headrow"><h3>11월 1주부터 · 연결된 메모 4개</h3>${search('메모 내용 검색','weekSearch')}</div>${memos.map(weekCard).join('')}</div><aside class="weeklypanel"><div class="panelhead"><h3>선택한 메모</h3><p>보드에 연결할 내용을 확인하세요.</p></div><div class="weeklylist"><div class="weekcard"><span class="tag green">원본 연결</span><h4>메인 화면 개선 아이디어</h4><p>원본을 수정하면 최신 내용이 보입니다. 보드에서 원본을 열어 편집합니다.</p></div></div><div class="panelfoot"><select id="linkMode" aria-label="추가 방식"><option value="ref">원본 연결</option><option value="copy">사본 만들기</option></select><button class="primary" data-action="add-weekly">${icon('link')}<span id="selectedCount">${state.selected.size}개</span> 보드에 추가</button></div></aside></div></div>`;return `<div class="content"><div class="boardbar"><div><div class="eyebrow">Cabi.NET / TASK BOARD</div><h2>서비스 개편</h2></div><div class="actions"><span class="tag green">누적 메모 연동</span>${btn('clock','주간 메모','open-weekly')}</div></div><div class="boardbody ${state.variant===1?'dimmed':''}"><div class="canvas" data-drop="task">${boardToolbar()}${boardObjects()}<div class="boardlegend">연결할 주간 메모를 골라 주세요.</div></div>${weeklyPanel(state.variant===1)}</div></div>`;}
function drag(){const source=state.reverse?'업무 보드 · 서비스 개편':'주간 메모 · 11월 1주';const target=state.reverse?'주간 메모 · 11월 1주':'업무 보드 · 서비스 개편';return `<div class="content"><div class="boardbar"><div><div class="eyebrow">CROSS-WINDOW COPY</div><h2>선택한 객체를 다른 보드에 복제</h2></div><div class="actions">${btn('copy','방향 바꾸기','reverse')}<span class="tag">원본 유지</span></div></div><div class="mock-warning">두 외부 창을 나란히 배치한 상황을 표현합니다. 이 페이지 안의 드래그는 시각 검토용입니다.</div><div class="cross"><section class="miniframe"><div class="miniheader"><span>${icon('board')} ${source}</span><small>보내는 창</small></div><div class="minicanvas"><div class="box yellow selected" style="left:28px;top:37px" draggable="true" data-drag="cross:group"><small>선택 묶음 · 객체 2개 / 관계선 1개</small><h3>개편 아이디어</h3><p>이 메모를 잡고 오른쪽 판으로<br>끌어 놓아 보세요.</p></div><svg class="connections" viewBox="0 0 450 400"><path d="M170 130H260V240H300"/></svg><div class="box blue selected" style="left:43%;top:230px;width:174px" draggable="true" data-drag="cross:group"><small>선택 객체 2</small><h3>사용자 동선</h3><p>메모와 자료를 함께 찾기</p></div><div class="mini-origin">복제 후에도 이 객체들은 그대로 남습니다.</div></div></section><section class="miniframe"><div class="miniheader"><span>${icon('board')} ${target}</span><small>받는 창</small></div>${state.variant===1?'<div class="dropbanner">이곳에 놓아 선택한 객체 2개 받기 ↓</div>':''}<div class="minicanvas" data-drop="cross">${state.copied?`<div class="box yellow" style="left:35px;top:65px"><small>독립 사본 · 원본은 유지</small><h3>개편 아이디어</h3><p>이 보드에서 자유롭게 수정</p></div><div class="box blue" style="left:43%;top:245px;width:174px"><small>독립 사본</small><h3>사용자 동선</h3><p>메모와 자료를 함께 찾기</p></div>`:state.variant===0?`<div class="dropzone"><span style="position:absolute;bottom:23px">${icon('copy')} 2개 복제 · 원본 유지</span></div><div class="box yellow ghost" style="left:35px;top:65px"><small>놓을 위치 미리보기</small><h3>개편 아이디어</h3><p>상대 위치와 관계선을 유지</p></div><div class="box blue ghost" style="left:43%;top:245px;width:174px"><h3>사용자 동선</h3></div>`:state.variant===2?`<div class="confirmdrop"><h3>이 보드에 복제할까요?</h3><p>객체 2개 · 내부 관계선 1개<br>텍스트·서식·색·상대 위치 유지<br>출처: ${source}</p><p>원본은 유지되며 이후 수정은<br>서로 동기화되지 않습니다.</p>${btn('copy','2개 복제','confirm-copy',true)}</div>`:'<div class="empty">상단 영역으로 끌어 놓은 뒤<br>배치할 위치를 선택합니다.</div>'}</div></section></div><div class="footline"><span>역방향 동일 지원 · 객체 ID 새로 발급 · 날짜별 업무항목 연결은 자동 복사하지 않음</span><span>자료 카드는 같은 원본 참조</span></div></div>`;}
function render(){const s=scenes[state.scene],o=s.options[state.variant];document.querySelector('#elements').innerHTML=Object.entries(scenes).map(([k,v])=>`<button data-scene="${k}" class="${state.scene===k?'active':''}" aria-pressed="${state.scene===k}">${v.label}</button>`).join('');document.querySelector('#variants').innerHTML=['A','B','C'].map((n,i)=>`<button data-variant="${i}" class="${state.variant===i?'active':''}" aria-pressed="${state.variant===i}">${n}${i===0?' · 추천':''}</button>`).join('');document.querySelector('#captionTitle').textContent=o[0];document.querySelector('#captionText').textContent=o[1];document.querySelector('#reviewPoint').textContent=o[2];document.querySelector('#windowTitle').textContent=s.title;document.querySelector('#recommend').textContent=state.variant===0?'추천안':'비교안';document.querySelector('#recommend').className='tag '+(state.variant===0?'green':'');document.querySelector('#screen').innerHTML=({hub,note,board,weekly,drag}[state.scene])();const p=new URLSearchParams({scene:state.scene,variant:String(state.variant)});history.replaceState(null,'','?'+p.toString());requestAnimationFrame(connectBoxes);}
function connectBoxes(){document.querySelectorAll('.canvas').forEach(canvas=>{const svg=canvas.querySelector('svg.connections'),boxes=canvas.querySelectorAll('.box');if(!svg||boxes.length<3)return;svg.removeAttribute('viewBox');const root=canvas.getBoundingClientRect(),a=boxes[0].getBoundingClientRect();svg.innerHTML=[boxes[1],boxes[2]].map((box,i)=>{const b=box.getBoundingClientRect();const x1=a.right-root.left,y1=a.top-root.top+a.height*(i===0?.38:.74),x2=b.left-root.left,y2=b.top-root.top+b.height/2,mx=(x1+x2)/2;return `<path d="M${x1} ${y1}H${mx}V${y2}H${x2}"/>`;}).join('');});}window.addEventListener('resize',connectBoxes);
let toastTimer;function toast(t){const el=document.querySelector('#toast');el.textContent=t;el.classList.remove('is-hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('is-hidden'),5000);}
document.addEventListener('click',e=>{const el=e.target.closest('button,[data-action],[data-week]');if(!el)return;if(el.dataset.scene){state.scene=el.dataset.scene;render();return}if(el.dataset.variant!==undefined){state.variant=Number(el.dataset.variant);state.hubView=state.variant===1?'cards':'list';state.copied=false;render();return}if(el.dataset.view){state.hubView=el.dataset.view;render();return}if(el.dataset.filter){state.hubType=el.dataset.filter;render();return}if(el.dataset.tab){state.hubTab=el.dataset.tab;render();return}if(el.dataset.week!==undefined){const i=Number(el.dataset.week);state.selected.has(i)?state.selected.delete(i):state.selected.add(i);render();return}const a=el.dataset.action;if(a)e.preventDefault();if(a==='open-note'){state.scene='note';state.variant=0;render()}else if(a==='open-board'){state.scene='board';state.variant=0;render()}else if(a==='open-weekly'){state.scene='weekly';state.variant=0;render()}else if(a==='close-weekly'){state.scene='board';state.variant=0;render()}else if(a==='preview'){state.preview=!state.preview;render()}else if(a==='library'){state.library=!state.library;render()}else if(a==='toc'){state.toc=!state.toc;render()}else if(a==='add-weekly'){if(!state.selected.size){toast('메모를 먼저 선택하세요.');return}const mode=document.querySelector('#linkMode')?.value||'ref';toast(`시안 데모: ${state.selected.size}개 ${mode==='ref'?'원본 연결 카드':'독립 사본'}를 추가합니다. 실제 데이터는 저장하지 않습니다.`)}else if(a==='confirm-copy'){state.copied=true;render();toast('시안 데모: 객체 2개 복제 · 원본 유지 · 관계선 1개 보존')}else if(a==='reverse'){state.reverse=!state.reverse;state.copied=false;render()}else if(a==='import')toast('설계: Markdown 파일 → 구조 미리보기 → 새 노트 또는 현재 위치에 삽입');else if(a==='export')toast('설계: Markdown + 이미지 묶음 / 텍스트 선택 가능한 PDF로 내보내기');else if(a==='register')toast('설계: 기존 폴더 또는 링크 등록 과정을 유지합니다.');else if(a==='new-note')toast('설계: 이 업무에 새 노트를 생성해 별도 창에서 엽니다.');else if(a==='sample')toast('비교용 샘플 화면입니다. 다른 업무/노트의 데이터는 연결하지 않았습니다.');else if(a==='zoom-in'||a==='zoom-out'){const z=document.querySelector('#zoomValue');if(z)z.textContent=Math.max(25,Math.min(200,parseInt(z.textContent)+(a==='zoom-in'?10:-10)))+'%'}else if(a==='link-info')toast('시안의 예시 링크입니다. 실제 노트에서는 기존 링크 텍스트 동작을 사용합니다.');else if(a==='info')toast('이 버튼은 배치 검토용입니다. 상세 동작은 설계 문서에 정리했습니다.');});
document.addEventListener('input',e=>{if(e.target.id==='hubSearch'){let n=0;document.querySelectorAll('[data-resource]').forEach(r=>{const visible=r.dataset.resource.includes(e.target.value);r.style.display=visible?'':'none';if(visible)n++});document.querySelector('.noresults')?.classList.toggle('is-hidden',n>0)}if(e.target.id==='weekSearch')document.querySelectorAll('[data-week]').forEach(r=>r.style.display=r.textContent.includes(e.target.value)?'':'none');});
document.addEventListener('dragstart',e=>{const el=e.target.closest('[data-drag]');if(!el)return;e.dataTransfer.setData('text/plain',el.dataset.drag);e.dataTransfer.effectAllowed='copy';});
document.addEventListener('dragover',e=>{const target=e.target.closest('[data-drop]');if(target){e.preventDefault();e.dataTransfer.dropEffect='copy';target.classList.add('dragover');}});
document.addEventListener('dragleave',e=>{const target=e.target.closest('[data-drop]');if(target&&!target.contains(e.relatedTarget))target.classList.remove('dragover');});
document.addEventListener('drop',e=>{const target=e.target.closest('[data-drop]');if(!target)return;e.preventDefault();target.classList.remove('dragover');const payload=e.dataTransfer.getData('text/plain');if(payload.startsWith('cross:')){state.copied=true;render();toast('시안 데모: 선택 객체 복제 · 원본은 그대로 유지')}else if(payload.startsWith('resource:')){const r=resources[Number(payload.split(':')[1])];if(!r)return;const rect=target.getBoundingClientRect();const el=document.createElement('article');el.className='box ref';el.style.left=Math.max(10,Math.min(target.clientWidth-220,e.clientX-rect.left-30))+'px';el.style.top=Math.max(60,Math.min(target.clientHeight-130,e.clientY-rect.top-20))+'px';el.innerHTML=`<div class="boxtag">${icon(r.kind)}${r.name} 원본 연결</div><h3>${r.title}</h3><small>시안에서 추가한 참조 카드</small>`;target.append(el);toast('시안 데모: 원본을 가리키는 자료 카드 추가')}else if(payload.startsWith('board:'))toast('설계: 다른 보드 창으로 끌면 독립 사본이 만들어집니다.');});
const params=new URLSearchParams(location.search);if(scenes[params.get('scene')])state.scene=params.get('scene');if(['0','1','2'].includes(params.get('variant')))state.variant=Number(params.get('variant'));if(state.variant===1)state.hubView='cards';render();
</script>
</body></html>
