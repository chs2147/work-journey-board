<svg viewBox="0 0 1400 480" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<title>Work Journey Board 스플래시 시안 3종</title>
<desc>앱 시작 시 보드가 준비될 때까지 창 전체에 보이는 스플래시 화면 시안. A 로고(미니멀), B 한 주가 채워지는 보드(추천), C 오늘 카드. 각 프레임은 1280×820 창을 축소한 것.</desc>
