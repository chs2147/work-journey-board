<text class="t" x="490" y="375" font-size="12.5" font-weight="600">월~금 카드에 개조식 줄이 차례로 채워짐</text>
<text class="ts" x="490" y="395" font-size="12.5">· 줄 12개가 40ms 간격, 총 600ms 이내 · 업무 색 팔레트</text>
<text class="ts" x="490" y="415" font-size="12.5">· 오늘 요일 카드 강조(--today-mark) · 글자 없는 도형만</text>
<text class="ts" x="490" y="435" font-size="12.5">· 제품 핵심(주간 보드 + 개조식)을 1초 안에 전달</text>
