<text class="t" x="960" y="375" font-size="12.5" font-weight="600">큰 날짜 + ISO 주차 + 요일 띠</text>
<text class="ts" x="960" y="395" font-size="12.5">· 날짜·주차는 JS가 domain/week.ts로 채움</text>
<text class="ts" x="960" y="415" font-size="12.5">· JS 전에는 로고·이름만 → 첫 장면이 덜 완성됨</text>
<text class="ts" x="960" y="435" font-size="12.5">· 상단 바 주차 표시와 정보가 겹침</text>
<text class="tm" x="20" y="464" font-size="11.5">공통: 창 배경색 = 스플래시 배경(흰 번쩍임 없음) · 준비 + 글꼴 로딩 + 최소 400ms 후 160ms 페이드아웃 · 3초 넘으면 진행 문구 · reduced-motion이면 정지 화면 · 다크 테마 자동</text>
