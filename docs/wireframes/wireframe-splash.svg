<text class="ts" x="20" y="395" font-size="12.5">· 아이콘 속 막대 3개가 차례로 솟음(80ms 간격)</text>
<text class="ts" x="20" y="415" font-size="12.5">· 가장 단순 — 어느 시작 시간에도 어색하지 않음</text>
