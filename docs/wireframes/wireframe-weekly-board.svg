<desc>행은 업무 카테고리, 열은 월~일. 오늘(목) 열이 넓게 펼쳐진 포커스 열이고 토·일은 좁은 열. 격자 아래에 업무 추가 행과 일일 메모 행, 오른쪽에 주간 요약 패널(자동 집계/AI본/수정본 탭과 클립보드 다리 버튼). 번호 설명은 하단.</desc>
