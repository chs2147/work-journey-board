<text class="btnpt" x="955.0" y="442" font-size="12" text-anchor="middle">보드 열기 →</text>
<text class="tm" x="740" y="370" font-size="11">→ 보드 열기 후 이번 주 · 오늘 열로 바로 진입</text>
