<svg viewBox="0 0 1400 600" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<title>Work Journey Board 첫 실행 흐름과 연간 보기 와이어프레임</title>
<desc>첫 실행 3단계(시작 선택, 저장 폴더 선택과 OneDrive 경고, 첫 업무 만들기)와 상단 바의 연간 보기 미니맵(월별 주 칸, 기록 밀도 색, 이번 주 강조).</desc>
<style>
 .t{fill:#2c2c2a} .ts{fill:#5f5e5a} .tm{fill:#8a8983}
 .page{fill:#faf9f5} .card{fill:#ffffff} .sub{fill:#f1efe8}
 .bd{stroke:#d3d1c7;fill:none} .bds{stroke:#b4b2a9;fill:none}
 .btn{fill:#ffffff;stroke:#b4b2a9} .btnp{fill:#185fa5;stroke:#185fa5} .btnpt{fill:#ffffff}
 .warn{fill:#fdf3e1;stroke:#c98500} .ok{fill:#e1f5ee;stroke:#0f6e56}
 .chip{fill:#ffffff;stroke:#d3d1c7}
 .arrow{stroke:#b4b2a9;stroke-width:2;fill:none}
</style>
<rect x="0" y="0" width="1400" height="600" rx="0" class="page"/>
<text class="ts" x="20" y="54" font-size="13" font-weight="600">① 시작</text>
<rect x="20" y="70" width="320" height="400" rx="12" class="card"/>
<rect x="20" y="70" width="320" height="400" rx="12" class="bds"/>
<path d="M346 270.0 L364 270.0 M358 264.0 L364 270.0 L358 276.0" class="arrow"/>
