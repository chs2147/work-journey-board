<rect x="370" y="70" width="320" height="400" rx="12" class="card"/>
<rect x="370" y="70" width="320" height="400" rx="12" class="bds"/>
<path d="M696 270.0 L714 270.0 M708 264.0 L714 270.0 L708 276.0" class="arrow"/>
<text class="ts" x="720" y="54" font-size="13" font-weight="600">③ 첫 업무 만들기</text>
<rect x="720" y="70" width="320" height="400" rx="12" class="card"/>
<rect x="720" y="70" width="320" height="400" rx="12" class="bds"/>
<text class="t" x="40" y="110" font-size="18" font-weight="700">Work Journey Board</text>
<text class="ts" x="40" y="136" font-size="12">매일 업무를 주간 보드에 적으면</text>
<text class="ts" x="40" y="154" font-size="12">주간 요약·엑셀·흐름 차트가 만들어집니다.</text>
<rect x="40" y="178" width="280" height="74" rx="8" class="ok"/>
<text class="t" x="52" y="202" font-size="12">기록은 이 PC의 파일 하나에만 저장되고</text>
<text class="t" x="52" y="220" font-size="12">외부로 전송되지 않습니다.</text>
<text class="ts" x="52" y="240" font-size="11">(AI 요약도 직접 복사·붙여넣기 할 때만)</text>
<rect x="40" y="370" width="280" height="30" rx="6" class="btnp"/>
<text class="btnpt" x="180.0" y="390" font-size="12" text-anchor="middle">새로 시작하기</text>
<rect x="40" y="410" width="280" height="30" rx="6" class="btn"/>
<text class="t" x="180.0" y="430" font-size="12" text-anchor="middle">기존 일지 열기 (PC 교체·복원)</text>
<text class="t" x="390" y="106" font-size="14" font-weight="700">기록 파일을 둘 폴더를 고르세요</text>
<text class="ts" x="390" y="128" font-size="11">이 폴더에 work-journey.db와 backups/가 생깁니다.</text>
<rect x="390" y="144" width="280" height="30" rx="6" class="sub"/>
<text class="t" x="400" y="164" font-size="11">C:\Users\user\OneDrive - Company\문서\Work…</text>
<rect x="600" y="182" width="70" height="30" rx="6" class="btn"/>
<text class="t" x="635.0" y="202" font-size="12" text-anchor="middle">찾아보기</text>
<rect x="390" y="222" width="280" height="120" rx="8" class="warn"/>
<text class="t" x="402" y="246" font-size="13" font-weight="700">⚠ OneDrive 동기화 폴더입니다</text>
<text class="t" x="402" y="268" font-size="11">업무 기록이 회사 클라우드로 자동</text>
<text class="t" x="402" y="284" font-size="11">업로드될 수 있습니다.</text>
<text class="ts" x="402" y="306" font-size="11">추천: C:\Users\user\WorkJourney</text>
<rect x="402" y="316" width="120" height="30" rx="6" class="btnp"/>
<text class="btnpt" x="462.0" y="336" font-size="12" text-anchor="middle">추천 폴더 사용</text>
<text class="ts" x="540" y="336" font-size="11">그래도 이 폴더 사용</text>
<text class="tm" x="390" y="370" font-size="11">감지: 경로에 OneDrive 환경 변수</text>
<text class="tm" x="390" y="386" font-size="11">(OneDrive, OneDriveCommercial) 접두어 포함</text>
<rect x="390" y="422" width="130" height="30" rx="6" class="btn"/>
<text class="t" x="455.0" y="442" font-size="12" text-anchor="middle">← 이전</text>
<rect x="540" y="422" width="130" height="30" rx="6" class="btnp"/>
