<text class="t" x="36" y="536" font-size="12">첫 실행만 3단계, 이후 실행은 곧바로 이번 주 보드(오늘 열 포커스)로 진입. 저장 폴더 경로는 %LOCALAPPDATA%\WorkJourneyBoard\config.json에만 기록.</text>
<text class="t" x="36" y="558" font-size="12">폴더에 이미 work-journey.db가 있으면 ②에서 "기존 일지를 찾았습니다 — 열기"로 분기(③ 생략). ③은 건너뛸 수 있음(빈 보드 + "+ 업무 추가" 안내).</text>
