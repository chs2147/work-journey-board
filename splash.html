<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Work Journey Board</title>
    <link rel="icon" href="data:," />
    <!--
      시작 스플래시 창(docs/splash-spec.md, 시안 B). 메인 창보다 작은 테두리 없는 창(560×340)으로 화면 가운데 뜬다.
      첫 장면은 HTML·CSS만으로 그린다. 인라인 script·style 속성 금지(CSP — Tauri가 <style>에 nonce를 붙이면 'unsafe-inline'이 무시됨).
      색은 tokens.css·palette.ts, 문구는 strings.ts·week.ts와 같은 값이어야 한다 — tests/unit/splash.test.ts가 대조한다.
    -->
    <link rel="stylesheet" href="/src/shared/fonts.css" />
    <style>
      :root {
        --sp-page: #faf9f5;
        --sp-card: #ffffff;
        --sp-line: #d3d1c7;
        --sp-text-1: #2c2c2a;
        --sp-text-2: #5f5e5a;
        --sp-text-3: #8a8983;
        --sp-accent: #185fa5;
        --sp-today: #d85a30;
        --sp-c1: #2a78d6;
        --sp-c2: #eb6834;
        --sp-c3: #1baf7a;
        --sp-c4: #eda100;
        --sp-c5: #e87ba4;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --sp-page: #1a1a19;
          --sp-card: #232322;
          --sp-line: #3d3d3a;
          --sp-text-1: #f0efec;
          --sp-text-2: #c3c2b7;
          --sp-text-3: #8f8e86;
          --sp-accent: #6da7ec;
          --sp-today: #ef7a4d;
          --sp-c1: #3987e5;
          --sp-c2: #d95926;
          --sp-c3: #199e70;
          --sp-c4: #c98500;
          --sp-c5: #d55181;
          color-scheme: dark;
        }
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        position: relative;
        box-sizing: border-box;
        display: grid;
        grid-template-rows: auto 1fr auto;
        gap: 22px;
        padding: 30px 32px 24px;
        background: var(--sp-card);
        color: var(--sp-text-1);
        font-family: "Pretendard Variable", "Malgun Gothic", "맑은 고딕", "Segoe UI", system-ui, sans-serif;
        cursor: default;
        user-select: none;
      }
      .week {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 12px;
      }
      .day {
        display: grid;
        justify-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--sp-text-3);
      }
      .day.today {
        font-weight: 700;
        animation: today-label 400ms ease-out 1700ms both;
      }
      .card {
        box-sizing: border-box;
        width: 100%;
        height: 104px;
        padding: 14px 11px;
        display: grid;
        align-content: start;
        gap: 13px;
        background: var(--sp-page);
        border: 1px solid var(--sp-line);
        border-radius: 8px;
        animation: card-in 360ms ease-out both;
        animation-delay: calc(var(--d) * 70ms);
      }
      /* 오늘 카드는 줄이 다 그려진 뒤 강조된다 */
      .day.today .card {
        animation:
          card-in 360ms ease-out both,
          today-in 400ms ease-out 1700ms both;
        animation-delay: calc(var(--d) * 70ms), 1700ms;
      }
      .d0 {
        --d: 0;
      }
      .d1 {
        --d: 1;
      }
      .d2 {
        --d: 2;
      }
      .d3 {
        --d: 3;
      }
      .d4 {
        --d: 4;
      }
      .card i {
        display: flex;
        align-items: center;
        gap: 7px;
        transform-origin: left center;
        animation: draw 280ms ease-out both;
        animation-delay: calc(450ms + var(--i) * 80ms);
      }
      .card i::before {
        content: "";
        flex: none;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--c);
      }
      .card i::after {
        content: "";
        width: var(--w);
        height: 6px;
        border-radius: 3px;
        background: var(--sp-line);
      }
      /* 줄별 순서·길이·색 */
      .card .l0 {
        --i: 0;
        --w: 78%;
        --c: var(--sp-c1);
      }
      .card .l1 {
        --i: 1;
        --w: 60%;
        --c: var(--sp-c2);
      }
      .card .l2 {
        --i: 2;
        --w: 70%;
        --c: var(--sp-c2);
      }
      .card .l3 {
        --i: 3;
        --w: 88%;
        --c: var(--sp-c3);
      }
      .card .l4 {
        --i: 4;
        --w: 50%;
        --c: var(--sp-c4);
      }
      .card .l5 {
        --i: 5;
        --w: 84%;
        --c: var(--sp-c3);
      }
      .card .l6 {
        --i: 6;
        --w: 56%;
        --c: var(--sp-c4);
      }
      .card .l7 {
        --i: 7;
        --w: 64%;
        --c: var(--sp-c4);
      }
      .card .l8 {
        --i: 8;
        --w: 80%;
        --c: var(--sp-c5);
      }
      .card .l9 {
        --i: 9;
        --w: 44%;
        --c: var(--sp-c1);
      }
      .card .l10 {
        --i: 10;
        --w: 74%;
        --c: var(--sp-c5);
      }
      .card .l11 {
        --i: 11;
        --w: 58%;
        --c: var(--sp-c1);
      }
      /* 움직임 순서(창이 뜬 뒤): 카드 0~0.6초 → 줄 12개 0.45~1.6초 → 오늘 강조 1.7초 → 진행 막대는 2.4초에 걸쳐 */
      @keyframes card-in {
        from {
          opacity: 0;
          transform: translateY(8px) scale(0.97);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes today-in {
        from {
          border-color: var(--sp-line);
          box-shadow: 0 0 0 0 var(--sp-today);
        }
        to {
          border-color: var(--sp-today);
          box-shadow: 0 0 0 1px var(--sp-today);
        }
      }
      @keyframes today-label {
        from {
          color: var(--sp-text-3);
        }
        to {
          color: var(--sp-today);
        }
      }
      @keyframes fade {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes draw {
        from {
          opacity: 0;
          transform: scaleX(0.2);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .lockup {
        align-self: center;
        display: flex;
        align-items: center;
        gap: 16px;
        animation: rise 420ms ease-out 200ms both;
      }
      .logo svg {
        display: block;
        width: 60px;
        height: 60px;
      }
      .titles {
        display: grid;
        gap: 8px;
      }
      .name {
        margin: 0;
        line-height: 0;
      }
      /* 워드마크 상자 높이 40px ≈ 대문자 21px(손글씨 위아래 여백 포함) */
      .name svg {
        display: block;
        width: auto;
        height: 40px;
        color: var(--sp-text-1);
      }
      .name .wm-j {
        fill: var(--sp-today);
      }
      .name .wm-u {
        stroke: var(--sp-today);
      }
      .tag {
        margin: 0;
        font-size: 14px;
        color: var(--sp-text-2);
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .foot {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 16px;
        font-size: 12px;
        color: var(--sp-text-3);
      }
      .status {
        margin: 0;
        color: var(--sp-text-2);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .ver {
        margin: 0;
        font-variant-numeric: tabular-nums;
      }
      .bar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 3px;
        background: var(--sp-page);
      }
      .bar::after {
        content: "";
        display: block;
        height: 100%;
        width: 92%;
        background: var(--sp-accent);
        transform-origin: left center;
        animation: fill 2400ms cubic-bezier(0.2, 0.7, 0.3, 1) both;
      }
      @keyframes fill {
        from {
          transform: scaleX(0);
        }
        to {
          transform: scaleX(1);
        }
      }
      /* Windows "애니메이션 효과" 끔: 크기·위치 움직임 대신 나타나기(투명도)만. 순서·진행 막대는 그대로 */
      @media (prefers-reduced-motion: reduce) {
        .card,
        .card i,
        .lockup {
          animation-name: fade;
        }
        .day.today .card {
          animation-name: fade, today-in;
        }
      }
    </style>
  </head>
  <body>
    <div class="week" aria-hidden="true">
      <div class="day d0">
        <span>월</span>
        <div class="card"><i class="l0"></i><i class="l1"></i></div>
      </div>
      <div class="day d1">
        <span>화</span>
        <div class="card"><i class="l2"></i><i class="l3"></i><i class="l4"></i></div>
      </div>
      <div class="day d2">
        <span>수</span>
        <div class="card"><i class="l5"></i><i class="l6"></i></div>
      </div>
      <div class="day d3">
        <span>목</span>
        <div class="card"><i class="l7"></i><i class="l8"></i><i class="l9"></i></div>
      </div>
      <div class="day d4">
        <span>금</span>
        <div class="card"><i class="l10"></i><i class="l11"></i></div>
      </div>
    </div>
